version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "github-actions"
      - "dependencies"
    groups:
      all-github-actions:
        patterns:
          - "*"

  # Maintain dependencies for Gradle
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "gradle"
      - "dependencies"
    groups:
      security-updates-gradle-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
      version-updates-gradle-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
