          { to: fourth-bedroom, via: fourth-bedroom-door, action: Push }
          { to: toilet, via: toilet-door, action: Push }
          { to: bathroom, via: bathroom-door, action: Push }
        ]
      }

      first-bedroom: {
        description: "A large, cold bedroom. A rusted iron bedstead dominates the room, its mattress a collapsed ruin of springs and stained ticking. Heavy curtains block all light, filling the room with a suffocating darkness."
