uk.co.baconi.games.tag.engine {
  layout {
    rooms {

      # --- Exterior: Front ---

      front-path: {
        description: "A fractured flagstone path cuts through the overgrown weeds, leading your eyes directly to a imposing, iron-bound oak door."
        items: {
          front-door: "A heavy oak door bound in weathered iron bands stands before you."
          gravel-path: "A winding flagstone path chokes under a thick layer of encroaching creeping ivy."
          rose-bush: "A massive, sprawling rose bush chokes the walkway with a tangled wall of blood-red blossoms and jagged thorns."
          plant-pot: "An oversized, urn-shaped terracotta pot sits heavy in the shadows beside the door frame."
        }
        connections: [
          { to: porch, via: front-door, action: Push }
          { to: drive, via: gravel-path, action: Walk }
        ]
      }

      porch: {
        description: "Stepping past the heavy oak door, you find yourself enclosed in a cramped, chill stone porch that smells faintly of trapped damp and old ash."
        items: {
          floor-grate: "A small iron drainage grate is set into the center of the floor, choked with hair and unidentifiable grime."
          lantern: "A single, unlit brass lantern hangs from a central chain, swaying slightly from the draft you just let in."
          iron-pegs: "A row of rusted iron pegs protrudes from the wall, one holding a rotting, mold-greened cloak."
          inner-door: "A secondary, lighter pine door faces you, separating this holding area from the main house."
          front-door: "The massive front door looms like the gate of a prison cell."
        }
        connections: [
          { to: front-path, via: front-door, action: Pull }
          { to: hallway, via: inner-door, action: Push }
        ]
      }

      drive: {
        description: "A sweeping, crescent-shaped gravel drive opens up before you, its pale stones stark against the dark, overgrown grounds."
        items: {
          gravel-path: "A winding flagstone path chokes under a thick layer of encroaching creeping ivy."
          wheelbarrow: "A forgotten, rotting wooden wheelbarrow sits overturned in the center, its iron wheel rusted solid."
          garage-door: "A broad, timber-framed garage door sags on its hinges, its lower panels swollen with years of trapped moisture."
        }
        connections: [
          { to: front-path, via: gravel-path, action: Walk }
          { to: garage, via: garage-door, action: Pull }
        ]
      }

      garage: {
        description: "The garage reeks of old motor oil and rust. Corroded tools hang from hooks along the walls, and a dark stain spreads across the cracked concrete floor where something once leaked and was never cleaned."
        items: {
          garage-door: "The broad timber garage door behind you groans in the draught, threatening to swing shut on its own."
          side-gate: "A tall, iron side gate separates the garage from the open yard beyond, its latch thick with orange rust."
          tool-rack: "A wall-mounted rack holds an assortment of corroded hand tools, several missing entirely."
        }
        connections: [
          { to: drive, via: garage-door, action: Push }
          { to: yard, via: side-gate, action: Pull }
        ]
      }

      # --- Interior: Ground Floor ---

      hallway: {
        description: "A long, dim hallway stretches before you. The floorboards groan underfoot and the wallpaper peels in long, curling strips, revealing damp plaster beneath. Doors line the walls like sentinels, most of them shut."
        items: {
          inner-door: "The porch door behind you is set into the bare stone of the entrance arch."
          dining-door: "A panelled door to your left bears a tarnished brass plate reading 'Dining Room'."
          kitchen-door: "A plain, utilitarian door leads towards the rear of the house."
          stairs-door: "A narrow door beneath the staircase conceals the space under the stairs."
          lounge-door: "A wide, imposing double door to your right hints at a once-grand sitting room."
          staircase: "A broad oak staircase rises steeply before you, its banister worn smooth by countless hands."
        }
        connections: [
          { to: porch, via: inner-door, action: Pull }
          { to: dining, via: dining-door, action: Push }
          { to: kitchen, via: kitchen-door, action: Push }
          { to: under-the-stairs, via: stairs-door, action: Pull }
          { to: lounge, via: lounge-door, action: Push }
          { to: staircase, via: staircase, action: Walk }
        ]
      }

      dining: {
        description: "A long dining table dominates the room, its surface warped and ringed with old watermarks. High-backed chairs stand at uneven angles as though abandoned mid-meal. A cold, empty hearth gapes at one end."
        items: {
          dining-table: "A warped oak dining table stretches the length of the room, its surface a map of old rings and scratches."
          fireplace: "A large stone fireplace dominates the far wall, its grate choked with cold ash and dead leaves."
          hallway-door: "A panelled door returns to the hallway."
        }
        connections: [
          { to: hallway, via: hallway-door, action: Pull }
        ]
      }

      lounge: {
        description: "A grand but decaying sitting room. Tattered velvet drapes pool on the floor beside tall, grimy windows. A massive fireplace dominates one wall, its mantelpiece cluttered with dust-caked ornaments. A conservatory door stands to one side."
        items: {
          velvet-drapes: "Heavy velvet curtains, once rich burgundy, have faded to a diseased pink and shed fibres onto the bare floorboards below."
          fireplace: "An enormous stone fireplace, its grate long cold, presides over the room. The chimney breast above it vanishes into the ceiling."
          chimney-door: "A low, iron-framed hatch in the side of the chimney breast opens onto a rusted ladder ascending within the stack."
          conservatory-door: "A tall glass-paned door, streaked with algae on the outside, leads into the conservatory."
          hallway-door: "A wide double door opens back into the hallway."
        }
        connections: [
          { to: hallway, via: hallway-door, action: Pull }
          { to: conservatory, via: conservatory-door, action: Push }
          { to: chimney-stack, via: chimney-door, action: Pull }
        ]
      }

      chimney-stack: {
        description: "You have squeezed through the hatch and now cling to a rusted iron ladder bolted to the inside of the chimney breast. Soot coats every surface. Above you, a grey circle of sky is just visible through the flue."
        items: {
          rusted-ladder: "Iron rungs, pocked with rust, are set into the sooty brick of the chimney's interior. They creak alarmingly under your weight."
          chimney-door: "The iron hatch below you leads back to the lounge."
          rooftop-hatch: "A heavy iron hatch at the top of the ladder is the only way onto the roof."
        }
        connections: [
          { to: lounge, via: chimney-door, action: Push }
          { to: roof, via: rooftop-hatch, action: Push }
        ]
      }

      under-the-stairs: {
        description: "A cramped, triangular cupboard of a space, barely large enough to stand upright. The smell of old boots and mildew is overwhelming. Shelves sag under the weight of forgotten clutter."
        items: {
          shelves: "Sagging wooden shelves line the walls, laden with cracked plant pots, old tins of paint, and unidentifiable bundles of rags."
          stairs-door: "The low door leads back out to the hallway."
        }
        connections: [
          { to: hallway, via: stairs-door, action: Push }
        ]
      }

      kitchen: {
        description: "A large, stone-floored kitchen that smells of cold grease and copper. A great iron range squats against one wall, its firebox long dead. Pots and pans dangle from a ceiling rack, coated in a film of ancient grime."
        items: {
          iron-range: "A vast, cast-iron cooking range dominates the wall, its iron surface pitted and cold."
          pantry-door: "A heavy door with a bolt on the outside leads into the pantry."
          back-passage-door: "A plain, unadorned door at the far end opens into the back passage."
          kitchen-door: "The door back to the hallway."
        }
        connections: [
          { to: hallway, via: kitchen-door, action: Pull }
          { to: pantry, via: pantry-door, action: Pull }
          { to: back-passage, via: back-passage-door, action: Push }
        ]
      }

      pantry: {
        description: "A cool, narrow pantry lined floor to ceiling with bare stone shelves. Most are empty, save for a few shrivelled, unidentifiable objects and the husks of long-dead insects."
        items: {
          stone-shelves: "Row upon row of bare stone shelves, built into the thick exterior wall, keep the room perpetually cold."
          pantry-door: "The bolted door leads back into the kitchen."
        }
        connections: [
          { to: kitchen, via: pantry-door, action: Push }
        ]
      }

      back-passage: {
        description: "A narrow, bare-brick corridor running along the rear of the house. The floor is cold flagstone and a persistent draught finds its way through the ill-fitting utility room door at the far end."
        items: {
          back-passage-door: "The door back to the kitchen."
          utility-door: "A warped wooden door, its frame visibly damp, leads into the utility room."
        }
        connections: [
          { to: kitchen, via: back-passage-door, action: Pull }
          { to: utility, via: utility-door, action: Push }
        ]
      }

      utility: {
        description: "A damp, functional room filled with the smell of mildew and old soap. A deep stone sink occupies one wall, a mangle beside it. A back door opens onto the yard."
        items: {
          stone-sink: "A deep, double-basin stone sink sits beneath a single cold tap, its overflow stained green with verdigris."
          mangle: "A large clothes mangle, its wooden rollers cracked with age, sits beside the sink."
          utility-door: "The door back into the back passage."
          back-door: "A heavy, iron-bolted back door opens onto the yard."
        }
        connections: [
          { to: back-passage, via: utility-door, action: Pull }
          { to: yard, via: back-door, action: Pull }
        ]
      }

      # --- Upper Floor ---

      staircase: {
        description: "The broad oak staircase creaks loudly with every step. The banister, once polished smooth, is now sticky with old varnish. A threadbare runner carpet holds itself in place with a series of tarnished brass rods."
        items: {
          staircase: "The worn staircase descends back into the hallway below."
          landing-door: "At the top of the stairs, a short landing stretches away into the darkness of the upper floor."
        }
        connections: [
          { to: hallway, via: staircase, action: Walk }
          { to: landing, via: landing-door, action: Walk }
        ]
      }

      landing: {
        description: "A wide, gloomy landing sits at the top of the staircase. Closed doors ring the space on all sides, each with its own faded nameplate. The floorboards flex disconcertingly underfoot."
