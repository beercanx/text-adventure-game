          staircase: "The staircase descends into the hallway below."
          first-bedroom-door: "A door bearing a tarnished '1' leads to the first bedroom."
          second-bedroom-door: "A door bearing a tarnished '2' leads to the second bedroom."
          third-bedroom-door: "A door bearing a tarnished '3' leads to the third bedroom."
          fourth-bedroom-door: "A door bearing a tarnished '4' leads to the fourth bedroom."
          toilet-door: "A narrow door leads to the toilet."
          bathroom-door: "A wider door with flaking white paint leads to the bathroom."
