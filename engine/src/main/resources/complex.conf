          iron-bedstead: "A grand iron bedstead, its frame thick with old rust, occupies most of the floor space."
          wardrobe: "A towering oak wardrobe stands against one wall, its door hanging open to reveal bare interior hooks."
          landing-door: "The door back to the landing."
