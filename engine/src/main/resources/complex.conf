        connections: [
          { to: landing, via: landing-door, action: Pull }
        ]
      }

      bathroom: {
        description: "A large, cold bathroom tiled floor to ceiling in cracked white ceramic. A claw-footed cast-iron bath dominates the center. A hatch in the ceiling, accessible via a short fold-down ladder, leads to the attic."
