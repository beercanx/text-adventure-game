      third-bedroom: {
        description: "A sparse, monastic bedroom with bare floorboards and plain whitewashed walls now yellowed with age. A single narrow window overlooks the back garden."
        items: {
          narrow-window: "A single narrow window looks out over the dark, overgrown garden below."
          iron-bedstead: "A thin, functional iron bedstead holds a bare mattress, striped in grey."
          landing-door: "The door back to the landing."
        }
        connections: [
          { to: landing, via: landing-door, action: Pull }
        ]
      }

      fourth-bedroom: {
        description: "The largest of the upper rooms, with a high ceiling and a cold marble fireplace. Dust sheets cover what little furniture remains, giving the room the look of a place of mourning."
        items: {
          marble-fireplace: "An elegant but cold marble fireplace dominates the wall, its grate empty and swept clean — the one tidy thing in the house."
