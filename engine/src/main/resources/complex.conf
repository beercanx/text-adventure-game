          chimney-stack: "The great chimney stack rises from the ridge of the roof, its mortar cracked and its cap partially collapsed."
          rooftop-hatch: "A heavy iron hatch set into the base of the chimney stack leads down into its interior."
          roof-slates: "Loose slates shift treacherously underfoot, threatening to slide away beneath you."
        }
        connections: [
          { to: attic, via: roof-hatch, action: Pull }
          { to: chimney-stack, via: rooftop-hatch, action: Pull }
        ]
      }

      # --- Exterior: Rear Grounds ---

      yard: {
        description: "A large, walled rear yard of cracked and uneven cobblestones. Weeds force their way through every joint. Outbuildings cluster at its edges and a rusted iron gate leads to the wider garden beyond."
